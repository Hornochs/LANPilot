name: Game support request
description: Ask for a new game or share what you know about its remote protocol
labels: [game-support]
body:
  - type: input
    id: game
    attributes:
      label: Game and version
      placeholder: "Call of Duty 2, v1.3 dedicated server"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Does the dedicated server have a remote-control interface?
      options:
        - "Yes, RCON or a similar console protocol"
        - "Yes, a web interface"
        - "Yes, something else"
        - "No, monitoring only would already help"
        - "I do not know"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What do you know about it?
      description: >
        Ports, how to authenticate, commands for listing maps, changing the map and restarting,
        links to documentation or existing tools. Do not paste real passwords.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can test against a real server
        - label: I would like to write the adapter
