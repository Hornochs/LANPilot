[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lanpilot"
dynamic = ["version"]
description = "Web interface for monitoring and remote-controlling game servers at LAN parties."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  {name = "Stephan Schaffner", email = "gamie@lan.party"},
]
keywords = ["lan-party", "game-server", "rcon", "trackmania", "unreal-tournament", "counter-strike"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
# Runtime dependencies are added in the step that first uses them (see docs/ROADMAP.md).
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pillow>=10.3",
  "python-multipart>=0.0.18",
  "sqlalchemy[asyncio]>=2.0.30",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx2>=2.0",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
lanpilot = "lanpilot.cli:main"

# Game adapters are discovered through this entry point group; third-party packages add
# their own entries to it.
[project.entry-points."lanpilot.adapters"]
demo = "lanpilot.games.demo:DemoAdapter"

[project.urls]
Homepage = "https://github.com/lan-dot-party/LANPilot"
Repository = "https://github.com/lan-dot-party/LANPilot"
Issues = "https://github.com/lan-dot-party/LANPilot/issues"
Changelog = "https://github.com/lan-dot-party/LANPilot/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/lanpilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lanpilot"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle, pyflakes
  "I",            # import order
  "N",            # naming
  "UP",           # modern syntax
  "B",            # bugbear
  "C4",           # comprehensions
  "SIM",          # simplifications
  "S",            # security (bandit)
  "ASYNC",        # asyncio pitfalls
  "PTH",          # pathlib
  "DTZ",          # timezone-aware datetimes
  "T20",          # no stray print()
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and test credentials are the point
"src/lanpilot/db/migrations/versions/*" = ["N999"]  # revision files start with a number
"src/lanpilot/cli.py" = ["T20"]  # the CLI prints by design
"src/lanpilot/testing/**" = ["S101"]  # contract checks report through AssertionError

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
xfail_strict = true

[tool.coverage.run]
source = ["lanpilot"]
branch = true
# SQLAlchemy's asyncio layer runs driver calls in greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
