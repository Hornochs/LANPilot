# Stock maps of the Quake 3 engine games: one table per adapter id, map key = display name.
#
# Quake III Arena: the long names from the arena scripts in baseq3/pak*.pk3 (1.32c,
# including the point-release maps). Call of Duty: the maps of maps/mp in the 1.5 server;
# its arena script names them only by key. Call of Duty 4: the stock maps in zone/english
# of the CoD4X 1.8 server. World at War: the multiplayer fast files of the 1.7 server, named
# as the game's localized strings (PATCH_* where the release renamed a map, else MPUI_*).
# CoD4 and WaW cannot list maps over RCON, so their tables are also their map lists (with
# the maps of sv_mapRotation). See docs/games/quake3.md.

