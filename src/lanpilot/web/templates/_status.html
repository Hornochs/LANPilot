{# Status badge and facts for one server; expects `state`. #}
{% macro badge(state) %}
{% if not state.enabled %}<span class="badge off">disabled</span>
{% elif not state.usable %}<span class="badge bad">needs attention</span>
{% elif state.online is none %}<span class="badge off">checking…</span>
{% elif state.online %}<span class="badge good">online</span>
{% else %}<span class="badge bad">offline</span>
{% endif %}
{% endmacro %}
