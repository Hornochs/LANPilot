{% extends "base.html" %}
{% block title %}{{ _("Sign in") }} – LANPilot{% endblock %}
{% block content %}
<section class="card narrow centered">
  <h1>{{ _("Sign in") }}</h1>
  {% if error %}
  <p class="banner error" role="alert">{{ error | tr }}</p>
  {% endif %}
  <form method="post" action="{{ root }}/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">{{ _("User name") }}</label>
    <input id="username" name="username" type="text" value="{{ username }}" maxlength="64"
           autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">{{ _("Password") }}</label>
    <input id="password" name="password" type="password" maxlength="256"
           autocomplete="current-password" required>
    <button type="submit">{{ _("Sign in") }}</button>
  </form>
</section>
{% endblock %}
